name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  container-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Build pinned execution image
        run: |
          docker build --tag specguard-runner:phase2 docker/runner
          echo "SPECGUARD_RUNNER_IMAGE=$(docker image inspect specguard-runner:phase2 --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Verify isolation and benchmark execution
        working-directory: backend
        env:
          SPECGUARD_DOCKER_TESTS: '1'
        run: python -m pytest tests/evaluation/test_execution_docker.py tests/evaluation/test_evaluation_docker.py tests/evaluation/test_product_docker.py -q
